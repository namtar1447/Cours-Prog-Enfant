<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cours Python — Plan de cours</title>
  <style>
    :root {
      --bg:      #1e1e2e;
      --surface: #2a2a3e;
      --accent:  #7c6af7;
      --accent2: #f7a26a;
      --text:    #cdd6f4;
      --muted:   #6c7086;
      --success: #a6e3a1;
      --error:   #f38ba8;
      --warning: #f9e2af;
      --gold:    #f5c542;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 2px solid var(--accent);
      padding: 28px 24px 20px;
      text-align: center;
    }
    header h1 { font-size: 2em; color: var(--accent); margin-bottom: 6px; }
    header p  { color: var(--muted); font-size: .95em; }

    .header-totals {
      display: flex; justify-content: center; gap: 28px;
      margin-top: 16px; flex-wrap: wrap;
    }
    .header-total {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
    }
    .header-total-num {
      font-size: 1.8em; font-weight: bold; color: var(--accent);
      font-family: 'Courier New', monospace;
    }
    .header-total-label { font-size: .8em; color: var(--muted); }

    /* ── Main layout ── */
    main { max-width: 1020px; margin: 0 auto; padding: 40px 20px 60px; }

    /* ── Bloc sections ── */
    .bloc { margin-bottom: 56px; }

    .bloc-header {
      display: flex; align-items: center; gap: 14px;
      margin-bottom: 12px; padding-bottom: 10px;
      border-bottom: 2px solid var(--accent);
    }
    .bloc-icon { font-size: 1.6em; }
    .bloc-header h2 { font-size: 1.3em; color: var(--text); }
    .bloc-header .bloc-ide {
      margin-left: auto; font-size: .8em;
      padding: 3px 10px; border-radius: 20px;
      background: rgba(124,106,247,.15); color: var(--accent);
      border: 1px solid rgba(124,106,247,.3); white-space: nowrap;
    }

    /* ── Bloc progress bar ── */
    .bloc-progress {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 18px;
    }
    .bloc-prog-track {
      flex: 1; background: #13131f; border-radius: 20px;
      height: 8px; overflow: hidden;
    }
    .bloc-prog-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 20px; width: 0%;
      transition: width 0.5s ease;
    }
    .bloc-prog-label { font-size: .82em; color: var(--muted); white-space: nowrap; }

    /* ── Lesson grid ── */
    .lesson-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }

    /* ── Lesson card ── */
    .lesson-card {
      background: var(--surface); border-radius: 12px;
      padding: 16px 18px; border: 1px solid rgba(124,106,247,.2);
      display: flex; flex-direction: column; gap: 10px;
      transition: all 0.2s;
    }
    .lesson-card.locked {
      opacity: 0.45; border-style: dashed;
    }

    .card-top {
      display: flex; flex-direction: column; gap: 6px;
    }
    .card-top-row {
      display: flex; align-items: center; gap: 8px;
    }
    .lesson-num {
      background: var(--accent); color: white;
      border-radius: 8px; padding: 2px 9px;
      font-size: .8em; font-weight: bold;
      white-space: nowrap; flex-shrink: 0;
    }
    .lesson-card.locked .lesson-num { background: var(--muted); }

    .card-title { font-size: .95em; font-weight: 600; color: var(--text); line-height: 1.35; }
    .card-project { font-size: .82em; color: var(--muted); line-height: 1.35; }

    /* ── Presentation link ── */
    .pres-link {
      margin-left: auto; flex-shrink: 0;
      font-size: .75em; padding: 3px 10px; border-radius: 20px;
      background: rgba(124,106,247,.15); color: var(--accent);
      border: 1px solid rgba(124,106,247,.35);
      text-decoration: none; white-space: nowrap;
      transition: all .15s;
    }
    .pres-link:hover { background: rgba(124,106,247,.3); }

    /* ── Exercise checkboxes ── */
    .exercises {
      display: flex; flex-direction: column; gap: 5px;
      padding-top: 6px; border-top: 1px solid rgba(255,255,255,.05);
    }
    .ex-row {
      display: flex; align-items: center; gap: 9px;
      padding: 5px 8px; border-radius: 8px;
      cursor: pointer; transition: background .15s; user-select: none;
    }
    .ex-row:hover { background: rgba(124,106,247,.08); }
    .ex-row.done  { background: rgba(166,227,161,.06); }

    .ex-check-box {
      width: 18px; height: 18px; border-radius: 4px; flex-shrink: 0;
      border: 2px solid var(--muted); background: transparent;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; transition: all .2s;
    }
    .ex-row.done .ex-check-box {
      border-color: var(--success); background: rgba(166,227,161,.2);
      color: var(--success);
    }
    .ex-label {
      font-size: .82em; color: var(--muted); transition: color .2s;
    }
    .ex-row.done .ex-label { color: var(--success); text-decoration: line-through; }

    /* ── Soon badge ── */
    .badge-soon {
      font-size: .75em; padding: 3px 10px; border-radius: 20px;
      background: rgba(108,112,134,.1); color: var(--muted);
      border: 1px solid rgba(108,112,134,.3);
      display: inline-block;
    }

    /* ── Project trophy card ── */
    .lesson-card.project-card {
      border-color: rgba(245,197,66,.2);
    }
    .lesson-card.project-card .lesson-num {
      background: linear-gradient(135deg, #c9a227, var(--gold));
    }

    .project-trophy-btn {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; border-radius: 10px; cursor: pointer;
      border: 2px dashed rgba(245,197,66,.35);
      background: rgba(245,197,66,.04);
      transition: all .2s; user-select: none;
      margin-top: 4px;
    }
    .project-trophy-btn:hover {
      border-color: var(--gold); background: rgba(245,197,66,.1);
    }
    .project-trophy-btn.completed {
      border-style: solid; border-color: var(--gold);
      background: rgba(245,197,66,.12);
    }

    .trophy-icon { font-size: 1.8em; line-height: 1; flex-shrink: 0; }
    .trophy-text { display: flex; flex-direction: column; gap: 2px; }
    .trophy-title {
      font-size: .85em; font-weight: bold; color: var(--gold);
      transition: all .2s;
    }
    .trophy-sub { font-size: .75em; color: var(--muted); }
    .project-trophy-btn.completed .trophy-sub { color: var(--gold); }

    /* ── Legend ── */
    .legend {
      display: flex; flex-wrap: wrap; gap: 14px;
      margin-bottom: 32px; padding: 14px 18px;
      background: var(--surface); border-radius: 10px; font-size: .85em;
    }
    .legend-item { display: flex; align-items: center; gap: 7px; color: var(--muted); }

    @media (max-width: 600px) {
      .lesson-grid { grid-template-columns: 1fr; }
      .bloc-header .bloc-ide { display: none; }
    }

    /* ── Confetti canvas ── */
    #confetti-canvas {
      position: fixed; inset: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 9999;
    }
  </style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<header>
  <h1>🐍 Cours Python — Adam</h1>

  <div class="header-totals">

// ═══════════════════════════════════════════════════════
// LOCALSTORAGE
// ═══════════════════════════════════════════════════════

function exKey(lessonNum, exIdx) {
  return `adam_ex_${lessonNum}_${exIdx}`;
}
function projKey(lessonNum) {
  return `adam_proj_${lessonNum}`;
}
function isDone(lessonNum, exIdx) {
  return localStorage.getItem(exKey(lessonNum, exIdx)) === '1';
}
function isProjDone(lessonNum) {
  return localStorage.getItem(projKey(lessonNum)) === '1';
}

function toggleEx(lessonNum, exIdx) {
  const key = exKey(lessonNum, exIdx);
  const nowDone = localStorage.getItem(key) !== '1';
  localStorage.setItem(key, nowDone ? '1' : '0');

  const row = document.getElementById(`ex-${lessonNum}-${exIdx}`);
  if (row) applyExState(row, nowDone);

  if (nowDone) {
    const bloc = BLOCS.find(b => b.lessons.some(l => l.num === lessonNum));
    if (bloc) {
      const { total, done } = blocProgress(bloc);
      if (total > 0 && done === total) launchConfetti();
    }
  }

  updateBlocProgress();
  updateTotals();
}

function toggleProj(lessonNum) {
  const key = projKey(lessonNum);
  const nowDone = localStorage.getItem(key) !== '1';
  localStorage.setItem(key, nowDone ? '1' : '0');

  const btn = document.getElementById(`proj-${lessonNum}`);
  if (btn) applyProjState(btn, nowDone);

  updateTotals();
}

// ═══════════════════════════════════════════════════════
// RENDU
// ═══════════════════════════════════════════════════════

function applyExState(row, done) {
  const box   = row.querySelector('.ex-check-box');
  const label = row.querySelector('.ex-label');
  row.classList.toggle('done', done);
  box.textContent = done ? '✓' : '';
}

function applyProjState(btn, done) {
  btn.classList.toggle('completed', done);
  btn.querySelector('.trophy-title').textContent =
    done ? '🎉 Projet complété !' : 'Marquer comme complété';
  btn.querySelector('.trophy-sub').textContent =
    done ? 'Clique pour annuler' : 'Clique quand tu as terminé';
}

function renderCourse() {
  const container = document.getElementById('course-content');

  BLOCS.forEach(bloc => {
    const blocEl = document.createElement('div');
    blocEl.className = 'bloc';
    blocEl.innerHTML = `
      <div class="bloc-header">
        <span class="bloc-icon">${bloc.icon}</span>
        <h2>${bloc.title}</h2>
        <span class="bloc-ide">IDE : ${bloc.ide}</span>
      </div>
      <div class="bloc-progress">
        <div class="bloc-prog-track">
          <div class="bloc-prog-fill" id="bloc-prog-${bloc.id}"></div>
        </div>
        <span class="bloc-prog-label" id="bloc-label-${bloc.id}">—</span>
      </div>
      <div class="lesson-grid" id="grid-${bloc.id}"></div>
    `;
    container.appendChild(blocEl);

    const grid = blocEl.querySelector(`#grid-${bloc.id}`);

    bloc.lessons.forEach(lesson => {
      const card = document.createElement('div');
      const isProj = !!lesson.isProject;
      card.className = `lesson-card ${lesson.available ? 'available' : 'locked'}${isProj ? ' project-card' : ''}`;

      let bodyHtml = '';

      if (!lesson.available) {
        bodyHtml = `<span class="badge-soon">🔒 À venir</span>`;
      } else if (isProj) {
        const done = isProjDone(lesson.num);
        bodyHtml = `
          <div class="project-trophy-btn${done ? ' completed' : ''}"
               id="proj-${lesson.num}"
               onclick="toggleProj('${lesson.num}')">
            <div class="trophy-icon">🏆</div>
            <div class="trophy-text">
              <div class="trophy-title">${done ? '🎉 Projet complété !' : 'Marquer comme complété'}</div>
              <div class="trophy-sub">${done ? 'Clique pour annuler' : 'Clique quand tu as terminé'}</div>
            </div>
          </div>`;
      } else if (lesson.exercises && lesson.exercises.length > 0) {
        const rows = lesson.exercises.map((exLabel, i) => {
          const done = isDone(lesson.num, i);
          return `
            <div class="ex-row${done ? ' done' : ''}"
                 id="ex-${lesson.num}-${i}"
                 onclick="toggleEx('${lesson.num}', ${i})">
              <div class="ex-check-box">${done ? '✓' : ''}</div>
              <div class="ex-label">${exLabel}</div>
            </div>`;
        }).join('');
        bodyHtml = `<div class="exercises">${rows}</div>`;
      }

      card.innerHTML = `
        <div class="card-top">
          <div class="card-top-row">
            <span class="lesson-num">Leçon ${lesson.num}</span>
            ${lesson.available ? `<a href="${lesson.folder}/presentation.html" class="pres-link" title="Ouvrir la présentation">📖</a>` : ''}
          </div>
          <div class="card-title">${lesson.title}</div>
          ${lesson.project ? `<div class="card-project">${lesson.project}</div>` : ''}
        </div>
        ${bodyHtml}
      `;
      grid.appendChild(card);
    });
  });

  updateBlocProgress();
  updateTotals();
}

function blocProgress(bloc) {
  let total = 0, done = 0;
  bloc.lessons.forEach(lesson => {
    if (!lesson.available || lesson.isProject) return;
    (lesson.exercises || []).forEach((_, i) => {
      total++;
      if (isDone(lesson.num, i)) done++;
    });
  });
  return { total, done };
}

function updateBlocProgress() {
  BLOCS.forEach(bloc => {
    const { total, done } = blocProgress(bloc);

    const fill  = document.getElementById(`bloc-prog-${bloc.id}`);
    const label = document.getElementById(`bloc-label-${bloc.id}`);
    if (!fill || !label) return;

    fill.style.width = total === 0 ? '0%' : (done / total * 100) + '%';
    label.textContent = total === 0
      ? 'Aucun exercice disponible'
      : `${done} / ${total} exercices complétés`;
  });
}

function updateTotals() {
  let totalEx = 0, doneEx = 0, doneProj = 0;
  BLOCS.forEach(bloc => {
    bloc.lessons.forEach(lesson => {
      if (!lesson.available) return;
      if (lesson.isProject) {
        if (isProjDone(lesson.num)) doneProj++;
      } else {
        (lesson.exercises || []).forEach((_, i) => {
          totalEx++;
          if (isDone(lesson.num, i)) doneEx++;
        });
      }
    });
  });
  document.getElementById('total-ex-num').textContent  = `${doneEx} / ${totalEx}`;
  document.getElementById('total-proj-num').textContent = doneProj;
}

// ═══════════════════════════════════════════════════════
// CONFETTI
// ═══════════════════════════════════════════════════════

const CONFETTI_COLORS = [
  ['#7c6af7', '#5a4dd4'],
  ['#f7a26a', '#c97a3e'],
  ['#a6e3a1', '#6db868'],
  ['#f9e2af', '#c9b06e'],
  ['#f38ba8', '#c06070'],
  ['#f5c542', '#c99e20'],
  ['#cdd6f4', '#8fa0c8'],
  ['#ffffff', '#bbbbbb'],
];

function launchConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  const ctx    = canvas.getContext('2d');
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;

  const pieces = [];
  const originX = window.innerWidth  / 2;
  const originY = window.innerHeight * 0.55;

  for (let i = 0; i < 260; i++) {
    const pair = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
    const angle = Math.random() * Math.PI * 2;
    const speed = 8 + Math.random() * 28;
    pieces.push({
      x:    originX + (Math.random() - 0.5) * 120,
      y:    originY,
      w:    7 + Math.random() * 9,
      h:    12 + Math.random() * 18,
      vx:   Math.cos(angle) * speed,
      vy:   -18 - Math.random() * 28,
      rot:  Math.random() * Math.PI * 2,
      rotV: (Math.random() - 0.5) * 0.25,
      color:     pair[0],
      colorBack: pair[1],
    });
  }

  let frame;
  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let alive = 0;

    for (const p of pieces) {
      p.vy  += 0.55;
      p.vy   = Math.min(p.vy, 12);
      p.vx  *= 0.985;
      p.x   += p.vx;
      p.y   += p.vy;
      p.rot += p.rotV;

      if (p.y > canvas.height + 30) continue;
      alive++;

      const scaleX = Math.cos(p.rot);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * 0.3);
      ctx.scale(scaleX, 1);
      ctx.fillStyle = scaleX > 0 ? p.color : p.colorBack;
      ctx.beginPath();
      ctx.roundRect(-p.w / 2, -p.h / 2, p.w, p.h, 2);
      ctx.fill();
      ctx.restore();
    }

    if (alive > 0) {
      frame = requestAnimationFrame(render);
    } else {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }

  if (frame) cancelAnimationFrame(frame);
  render();
}

renderCourse();
</script>
